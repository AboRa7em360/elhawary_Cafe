<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة العرض</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #09090b; --accent: #f59e0b; --text: #fff; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .tv-header { background: rgba(0,0,0,0.5); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(245, 158, 11, 0.3); }
        .tv-header h1 { margin: 0; font-size: 40px; font-weight: 900; color: var(--accent); }
        .qr-section { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); }
        .qr-section img { width: 80px; height: 80px; border-radius: 10px; background: #fff; padding: 5px; }
        .qr-text { font-size: 18px; font-weight: bold; line-height: 1.4; }
        .slider-container { flex-grow: 1; position: relative; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1e293b 0%, #09090b 100%); }
        .slide { position: absolute; width: 80%; height: 80%; display: flex; align-items: center; opacity: 0; transition: opacity 1s ease-in-out, transform 1s ease-in-out; transform: scale(0.95); }
        .slide.active { opacity: 1; transform: scale(1); z-index: 10; }
        .slide-img-box { flex: 1; height: 100%; display: flex; justify-content: center; align-items: center; }
        .slide-img-box img { max-width: 100%; max-height: 100%; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); object-fit: cover; }
        .slide-info { flex: 1; padding: 50px; text-align: right; }
        .slide-title { font-size: 70px; font-weight: 900; margin-bottom: 20px; line-height: 1.2; }
        .slide-price { font-size: 50px; color: var(--accent); font-weight: bold; background: rgba(245, 158, 11, 0.1); display: inline-block; padding: 15px 40px; border-radius: 20px; }
        .tv-footer { background: var(--accent); color: #000; padding: 15px 0; font-size: 30px; font-weight: 900; display: flex; align-items: center; overflow: hidden; white-space: nowrap; }
        .ticker-title { background: #000; color: var(--accent); padding: 15px 30px; font-size: 25px; z-index: 2; margin-right: 20px; border-radius: 15px; }
        marquee { flex-grow: 1; margin-left: 20px; font-weight: 800; color: #000; }
    </style>
</head>
<body>

    <div class="tv-header">
        <h1 id="cafeName">جاري التحميل...</h1>
        <div class="qr-section">
            <div class="qr-text">امسح الباركود<br><span style="color: var(--accent);">للطلب من طاولتك</span></div>
            <img id="qrCode" src="" alt="QR Code">
        </div>
    </div>

    <div class="slider-container" id="slider">
        <div style="text-align: center; color: #64748b; font-size: 30px;">
            <i class="fas fa-spinner fa-spin" style="font-size: 60px; color: var(--accent); margin-bottom: 20px;"></i>
            <p>جاري تحميل العروض والمنتجات...</p>
        </div>
    </div>

    <div class="tv-footer">
        <div class="ticker-title"><i class="fas fa-bolt"></i> عروض اليوم</div>
        <marquee id="marqueeText" scrollamount="6">أهلاً بكم في كافيه الهواري - نتمنى لكم وقتاً ممتعاً</marquee>
    </div>

    <script>
        const SUPABASE_URL = 'https://izfvaxfhdugqruxigbfa.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6ZnZheGZoZHVncXJ1eGlnYmZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MDQ2OTgsImV4cCI6MjEwNjk4MDY5OH0.DXBtBIjNQaY6JEnTz5BLV7uY-1Xvx-JH61WLMyMjbsk';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        let cafeToken = urlParams.get('cafe');
        const cafeIdParam = urlParams.get('id');

        if (!cafeToken && !cafeIdParam) {
            const fullQuery = window.location.search.replace('?', '');
            if (fullQuery.includes('cafe=')) {
                cafeToken = fullQuery.split('cafe=')[1].split('&')[0];
            }
        }

        let currentSlide = 0;
        let slides = [];

        async function fetchTvData() {
            try {
                let cafeQuery = db.from('cafes').select('id, name, is_active');
                
                if (cafeToken) {
                    cafeQuery = cafeQuery.eq('public_token', cafeToken);
                } else if (cafeIdParam) {
                    cafeQuery = cafeQuery.eq('id', cafeIdParam);
                } else {
                    const { data: defaultCafe } = await db.from('cafes').select('id, name, is_active').eq('is_active', true).order('id', { ascending: false }).limit(1).single();
                    if (defaultCafe) {
                        loadTvContent(defaultCafe.id, defaultCafe.name);
                        return;
                    }
                    return;
                }

                const { data: cafeData } = await cafeQuery.single();
                if(!cafeData || !cafeData.is_active) return;
                
                loadTvContent(cafeData.id, cafeData.name);

            } catch (err) {}
        }

        async function loadTvContent(cafeId, cafeName) {
            document.getElementById('cafeName').innerText = cafeName;

            // رابط الباركود للعملاء
            const currentLink = window.location.href.replace('tv.html', 'index.html');
            document.getElementById('qrCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentLink)}`;

            // جلب نص الإعلان والشريط المتحرك الخاص بالكافيه
            const { data: settings } = await db.from('settings').select('marquee_text').eq('cafe_id', cafeId).single();
            if(settings && settings.marquee_text) {
                document.getElementById('marqueeText').innerText = settings.marquee_text;
            } else {
                document.getElementById('marqueeText').innerText = `أهلاً بكم في ${cafeName} - استمتعوا بأفضل المشروبات والخدمات`;
            }

            // جلب المنتجات التي تحتوي على صور فقط لعرضها في السلايدر
            const { data: products } = await db.from('products').select('*').eq('cafe_id', cafeId).neq('image_url', '');
            
            const slider = document.getElementById('slider');
            if(!products || products.length === 0) {
                slider.innerHTML = '<div style="text-align: center; color: #64748b; font-size: 40px;"><i class="fas fa-images"></i><br>لا توجد منتجات مصورة لعرضها حالياً</div>';
                return;
            }

            slider.innerHTML = '';
            products.forEach((p, index) => {
                const slide = document.createElement('div');
                slide.className = `slide ${index === 0 ? 'active' : ''}`;
                
                let priceDisplay = `${p.price} ج.م`;
                if(p.original_price && p.original_price > p.price) {
                    priceDisplay = `<span style="text-decoration: line-through; color: #94a3b8; font-size: 35px; margin-left: 15px;">${p.original_price} ج.م</span> ${p.price} ج.م`;
                }

                slide.innerHTML = `
                    <div class="slide-info">
                        <div class="slide-title">${p.name}</div>
                        <div class="slide-price">${priceDisplay}</div>
                    </div>
                    <div class="slide-img-box"><img src="${p.image_url}" alt="${p.name}"></div>
                `;
                slider.appendChild(slide);
            });

            slides = document.querySelectorAll('.slide');
            if(slides.length > 1) {
                setInterval(nextSlide, 5000);
            }
        }

        function nextSlide() {
            if(slides.length === 0) return;
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        fetchTvData();
        setInterval(fetchTvData, 60000); // تحديث البيانات كل دقيقة
    </script>
</body>
</html>
