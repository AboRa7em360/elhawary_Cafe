<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة العرض</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #f8fafc; --card-bg: #ffffff; --accent: #d97706; --text-main: #0f172a; --text-muted: #64748b; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text-main); margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        .tv-header { background: #ffffff; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .tv-header h1 { margin: 0; font-size: 45px; font-weight: 900; color: var(--accent); }
        
        .qr-wrapper { display: flex; flex-direction: column; align-items: flex-end; }
        .qr-section { display: flex; align-items: center; gap: 15px; background: #f1f5f9; padding: 8px 18px; border-radius: 15px; border: 1px solid #cbd5e1; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .qr-section img { width: 70px; height: 70px; border-radius: 10px; background: #fff; padding: 4px; border: 1px solid #e2e8f0; }
        .qr-text { font-size: 15px; font-weight: bold; line-height: 1.4; color: #334155; }

        .welcome-ticker-box { width: 100%; background: #1e293b; border-bottom: 4px solid var(--accent); padding: 14px 0; overflow: hidden; white-space: nowrap; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; z-index: 20; }
        .ticker-content { display: inline-block; animation: scrollRightToLeft 28s linear infinite; font-size: 26px; font-weight: 900; color: #fde047; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .ticker-content span { color: #4ade80; margin: 0 15px; }
        .ticker-content i { color: var(--accent); margin-left: 10px; margin-right: 25px; }

        @keyframes scrollRightToLeft {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100vw); }
        }

        .admin-promo-banner { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(248, 250, 252, 0.98); backdrop-filter: blur(15px); z-index: 999; display: flex; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .promo-card { background: #ffffff; border: 4px solid var(--accent); border-radius: 30px; display: flex; flex-direction: column; width: 90%; max-width: 950px; height: 86vh; overflow: hidden; box-shadow: 0 35px 90px rgba(0,0,0,0.15); animation: popIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; }
        .promo-info { flex: 1.1; padding: 30px 40px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; box-sizing: border-box; background: #f8fafc; }
        .promo-badge { background: linear-gradient(45deg, #e74c3c, #f39c12); color: #fff; font-size: 15px; font-weight: bold; padding: 5px 18px; border-radius: 20px; display: inline-block; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(231,76,60,0.3); }
        .promo-title { font-size: 45px; font-weight: 900; color: #0f172a; margin-bottom: 10px; line-height: 1.2; }
        .promo-desc { font-size: 24px; color: #475569; margin-bottom: 15px; line-height: 1.4; }
        .promo-phone { font-size: 30px; color: #fff; font-weight: 900; background: linear-gradient(135deg, #16a34a, #15803d); padding: 10px 25px; border-radius: 20px; display: inline-flex; align-items: center; gap: 15px; box-shadow: 0 10px 25px rgba(22, 163, 74, 0.3); direction: ltr; }
        .promo-phone i { color: #fde047; font-size: 28px; }
        .promo-img-container { flex: 1.5; width: 100%; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; border-top: 2px solid #e2e8f0; }
        .promo-slide-img { width: 100%; height: 100%; object-fit: cover; }

        @keyframes popIn { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* منطقة عرض المنتجات (مع 4 أنظمة حركات سينمائية مبهرة بالتبادل) */
        .slider-container { flex-grow: 1; position: relative; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #ffffff 0%, #f1f5f9 100%); overflow: hidden; }
        
        .slide { position: absolute; width: 85%; height: 75%; display: flex; align-items: center; justify-content: space-between; opacity: 0; pointer-events: none; transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* أنظمة الحركات المختلفة */
        .slide.active { opacity: 1; transform: none; pointer-events: auto; z-index: 10; }
        
        /* نظام 1: التمويع والتداخل (Fade & Blur) */
        .slide.effect-fade { transform: scale(0.95); filter: blur(5px); }
        .slide.effect-fade.active { transform: scale(1); filter: blur(0); }

        /* نظام 2: التكبير الدائري (Zoom In) */
        .slide.effect-zoom { transform: scale(0.7); }
        .slide.effect-zoom.active { transform: scale(1); }

        /* نظام 3: الانزلاق السينمائي (Slide From Right) */
        .slide.effect-slide { transform: translateX(150px); }
        .slide.effect-slide.active { transform: translateX(0); }

        /* نظام 4: الدوران الخفيف (Rotate Soft) */
        .slide.effect-rotate { transform: scale(0.9) rotate(-5deg); }
        .slide.effect-rotate.active { transform: scale(1) rotate(0deg); }

        .slide-img-box { flex: 1; height: 100%; display: flex; justify-content: center; align-items: center; }
        .slide-img-box img { max-width: 85%; max-height: 85%; border-radius: 35px; box-shadow: 0 25px 60px rgba(0,0,0,0.15); object-fit: cover; border: 4px solid #ffffff; background: #fff; }
        
        .slide-info { flex: 1.2; padding: 40px; text-align: right; display: flex; flex-direction: column; justify-content: center; }
        .slide-title { font-size: 75px; font-weight: 900; margin-bottom: 20px; line-height: 1.1; color: #0f172a; text-shadow: 0 2px 10px rgba(0,0,0,0.05); }
        .slide-price { font-size: 55px; color: #16a34a; font-weight: 900; background: rgba(22, 163, 74, 0.1); display: inline-block; padding: 12px 40px; border-radius: 20px; border: 2px solid rgba(22, 163, 74, 0.3); width: fit-content; box-shadow: 0 8px 20px rgba(22, 163, 74, 0.15); }
        .old-price-tv { text-decoration: line-through; color: #94a3b8; font-size: 38px; margin-left: 15px; }
    </style>
</head>
<body>

    <div class="tv-header">
        <h1 id="cafeName">جاري التحميل...</h1>
        <div class="qr-wrapper">
            <div class="qr-section">
                <div class="qr-text">امسح الباركود<br><span style="color: var(--accent);">للطلب من طاولتك</span></div>
                <img id="qrCode" src="" alt="QR Code">
            </div>
        </div>
    </div>

    <div class="welcome-ticker-box">
        <div class="ticker-content" id="tickerText">
            <i class="fas fa-mug-hot"></i> جاري التحميل...
        </div>
    </div>

    <div id="adminPromoBox" class="admin-promo-banner" style="display: none;">
        <div class="promo-card">
            <div class="promo-info">
                <div class="promo-badge"><i class="fas fa-star"></i> إعلان مميز وخارجي</div>
                <div class="promo-title" id="promoTitle">العنوان</div>
                <div class="promo-desc" id="promoDesc">التفاصيل</div>
                <div class="promo-phone" id="promoPhoneBox"><i class="fas fa-phone-alt"></i> <span id="promoPhone" dir="ltr">01000000000</span></div>
            </div>
            <div class="promo-img-container" id="promoImgContainer"></div>
        </div>
    </div>

    <div class="slider-container" id="slider">
        <div style="text-align: center; color: #64748b; font-size: 30px;">
            <i class="fas fa-spinner fa-spin" style="font-size: 60px; color: var(--accent); margin-bottom: 20px;"></i>
            <p>جاري تحميل العروض والمنتجات...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://izfvaxfhdugqruxigbfa.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6ZnZheGZoZHVncXJ1eGlnYmZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MDQ2OTgsImV4cCI6MjEwNjk4MDY5OH0.DXBtBIjNQaY6JEnTz5BLV7uY-1Xvx-JH61WLMyMjbsk';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        let cafeToken = urlParams.get('cafe');
        const cafeIdParam = urlParams.get('id');

        if (!cafeToken && !cafeIdParam) {
            const fullQuery = window.location.search.replace('?', '');
            if (fullQuery.includes('cafe=')) {
                cafeToken = fullQuery.split('cafe=')[1].split('&')[0];
            }
        }

        let currentSlide = 0;
        let slides = [];
        let promoSlides = [];
        let currentPromoIndex = 0;
        let promoInterval = null;
        let productInterval = null;
        
        // مصفوفة أنظمة الحركات المختلفة
        const effects = ['effect-fade', 'effect-zoom', 'effect-slide', 'effect-rotate'];

        async function fetchTvData() {
            try {
                let cafeQuery = db.from('cafes').select('id, name, is_active');
                if (cafeToken) cafeQuery = cafeQuery.eq('public_token', cafeToken);
                else if (cafeIdParam) cafeQuery = cafeQuery.eq('id', cafeIdParam);
                else {
                    const { data: defaultCafe } = await db.from('cafes').select('id, name, is_active').eq('is_active', true).order('id', { ascending: false }).limit(1).single();
                    if (defaultCafe) { loadTvContent(defaultCafe.id, defaultCafe.name); return; }
                    return;
                }

                const { data: cafeData } = await cafeQuery.single();
                if(!cafeData || !cafeData.is_active) return;
                
                loadTvContent(cafeData.id, cafeData.name);
            } catch (err) {}
        }

        async function loadTvContent(cafeId, cafeName) {
            document.getElementById('cafeName').innerText = cafeName;

            const currentLink = window.location.href.replace('tv.html', 'index.html');
            document.getElementById('qrCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentLink)}`;

            const { data: settings } = await db.from('settings').select('*').eq('cafe_id', cafeId).single();
            
            const promoBox = document.getElementById('adminPromoBox');
            if (settings && settings.is_ads_active && settings.ad_slides && settings.ad_slides.length > 0) {
                promoBox.style.display = 'flex';
                promoSlides = settings.ad_slides;
                const phoneNum = settings.ad_phone || '';
                
                if(phoneNum) {
                    document.getElementById('promoPhoneBox').style.display = 'inline-flex';
                    document.getElementById('promoPhone').innerText = phoneNum;
                } else {
                    document.getElementById('promoPhoneBox').style.display = 'none';
                }

                renderPromoSlide();
                if(!promoInterval && promoSlides.length > 1) {
                    promoInterval = setInterval(nextPromoSlide, 5000);
                }
            } else {
                promoBox.style.display = 'none';
                if(promoInterval) { clearInterval(promoInterval); promoInterval = null; }
            }

            let announcement = (settings && settings.marquee_text) ? settings.marquee_text : `أهلاً بكم في ${cafeName} - استمتعوا بأجمل المشروبات والخدمات`;
            document.getElementById('tickerText').innerHTML = `
                <i class="fas fa-fire"></i> <span>${announcement}</span> 
                <i class="fas fa-coffee"></i> <span>امسح الباركود واطلب من طاولتك فوراً!</span> 
                <i class="fas fa-star"></i> <span>${announcement}</span>
            `;

            const { data: products } = await db.from('products').select('*').eq('cafe_id', cafeId).neq('image_url', '');
            const slider = document.getElementById('slider');
            
            if(!products || products.length === 0) {
                slider.innerHTML = '<div style="text-align: center; color: #64748b; font-size: 40px;"><i class="fas fa-images"></i><br>لا توجد منتجات مصورة لعرضها حالياً</div>';
                return;
            }

            let slidesHtml = '';
            products.forEach((p, index) => {
                let priceDisplay = `${p.price} ج.م`;
                if(p.original_price && p.original_price > p.price) {
                    priceDisplay = `<span class="old-price-tv">${p.original_price} ج.م</span> <span style="color:#16a34a;">${p.price} ج.م</span>`;
                }

                // اختيار حركة عشوائية أو بالتبادل لكل منتج
                let randomEffect = effects[index % effects.length];

                slidesHtml += `
                    <div class="slide ${randomEffect} ${index === 0 ? 'active' : ''}">
                        <div class="slide-info">
                            <div class="slide-title">${p.name}</div>
                            <div class="slide-price">${priceDisplay}</div>
                        </div>
                        <div class="slide-img-box"><img src="${p.image_url}" alt="${p.name}"></div>
                    </div>
                `;
            });
            slider.innerHTML = slidesHtml;

            slides = document.querySelectorAll('.slide');
            currentSlide = 0;
            
            if(productInterval) clearInterval(productInterval);
            if(slides.length > 1) {
                productInterval = setInterval(nextSlide, 6000);
            }
        }

        function renderPromoSlide() {
            if(!promoSlides || promoSlides.length === 0) return;
            const current = promoSlides[currentPromoIndex];
            
            document.getElementById('promoTitle').innerText = current.title || '';
            document.getElementById('promoDesc').innerText = current.desc || '';
            
            const imgContainer = document.getElementById('promoImgContainer');
            if (current.image) {
                imgContainer.innerHTML = `<img src="${current.image}" class="promo-slide-img" alt="Promo Image">`;
            } else {
                imgContainer.innerHTML = `<i class="fas fa-bullhorn" style="font-size: 100px; color: var(--accent);"></i>`;
            }
        }

        function nextPromoSlide() {
            if(promoSlides.length <= 1) return;
            currentPromoIndex = (currentPromoIndex + 1) % promoSlides.length;
            renderPromoSlide();
        }

        function nextSlide() {
            if(slides.length === 0) return;
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        fetchTvData();
        setInterval(fetchTvData, 10000);
    </script>
</body>
</html>
