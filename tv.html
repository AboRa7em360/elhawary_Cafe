<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة العرض</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #09090b; --accent: #f59e0b; --text: #fff; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        .tv-header { background: rgba(0,0,0,0.7); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(245, 158, 11, 0.3); }
        .tv-header h1 { margin: 0; font-size: 45px; font-weight: 900; color: var(--accent); text-shadow: 0 0 15px rgba(245,158,11,0.4); }
        
        .qr-wrapper { display: flex; flex-direction: column; align-items: flex-end; }
        .qr-section { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.08); padding: 8px 18px; border-radius: 15px; border: 1px solid rgba(245, 158, 11, 0.3); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .qr-section img { width: 70px; height: 70px; border-radius: 10px; background: #fff; padding: 4px; }
        .qr-text { font-size: 15px; font-weight: bold; line-height: 1.4; color: #f8fafc; }

        /* شريط الترحيب */
        .welcome-ticker-box { width: 100%; background: linear-gradient(90deg, #1e293b, #0f172a, #1e293b); border-bottom: 3px solid var(--accent); padding: 14px 0; overflow: hidden; white-space: nowrap; box-shadow: 0 10px 25px rgba(0,0,0,0.8); position: relative; z-index: 20; }
        .ticker-content { display: inline-block; animation: scrollRightToLeft 28s linear infinite; font-size: 26px; font-weight: 900; color: #fde047; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
        .ticker-content span { color: #4ade80; margin: 0 15px; }
        .ticker-content i { color: var(--accent); margin-left: 10px; margin-right: 25px; }

        @keyframes scrollRightToLeft {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100vw); }
        }

        /* بوكس الإعلان الخارجي (الكتابة فوق والصورة تحت بحركات فخمة) */
        .admin-promo-banner { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(9, 9, 11, 0.98); backdrop-filter: blur(15px); z-index: 999; display: flex; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        
        .promo-card { background: linear-gradient(135deg, #1e293b, #0f172a); border: 3px solid var(--accent); border-radius: 30px; display: flex; flex-direction: column; width: 90%; max-width: 950px; height: 85vh; overflow: hidden; box-shadow: 0 35px 90px rgba(0,0,0,0.95); animation: popIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        /* قسم النصوص فوق بحركات ديناميكية */
        .promo-info { flex: 1.1; padding: 35px 40px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; box-sizing: border-box; background: rgba(15, 23, 42, 0.6); }
        
        .promo-badge { background: linear-gradient(45deg, #e74c3c, #f39c12); color: #fff; font-size: 16px; font-weight: bold; padding: 6px 20px; border-radius: 20px; display: inline-block; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(231,76,60,0.5); animation: bounceBadge 2s infinite; }
        
        .promo-title { font-size: 50px; font-weight: 900; color: #f8fafc; margin-bottom: 12px; line-height: 1.2; text-shadow: 0 3px 10px rgba(0,0,0,0.8); animation: slideDown 0.8s ease; }
        .promo-desc { font-size: 26px; color: #cbd5e1; margin-bottom: 20px; line-height: 1.4; animation: fadeIn 1s ease; }
        
        .promo-phone { font-size: 32px; color: #fff; font-weight: 900; background: linear-gradient(135deg, #22c55e, #16a34a); padding: 12px 30px; border-radius: 20px; display: inline-flex; align-items: center; gap: 15px; box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4); direction: ltr; animation: pulsePhone 1.5s infinite; }
        .promo-phone i { color: #fde047; font-size: 30px; }

        /* قسم الصورة تحت بحركات سينمائية تطلع يمين شمال وفوق تحت */
        .promo-img { flex: 1.4; width: 100%; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; border-top: 2px solid rgba(245, 158, 11, 0.2); }
        .promo-img img { width: 100%; height: 100%; object-fit: cover; animation: cinematicMotion 10s ease-in-out infinite alternate; }

        @keyframes cinematicMotion {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.08) translate(15px, -10px); }
            100% { transform: scale(1.05) translate(-15px, 10px); }
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes bounceBadge {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes pulsePhone {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .slider-container { flex-grow: 1; position: relative; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1e293b 0%, #09090b 100%); overflow: hidden; }
        .slide { position: absolute; width: 85%; height: 75%; display: flex; align-items: center; opacity: 0; transform: scale(0.8) rotate(-3deg); transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .slide.active { opacity: 1; transform: scale(1) rotate(0deg); z-index: 10; }
        .slide-img-box { flex: 1; height: 100%; display: flex; justify-content: center; align-items: center; }
        .slide-img-box img { max-width: 85%; max-height: 85%; border-radius: 35px; box-shadow: 0 30px 70px rgba(0,0,0,0.9); object-fit: cover; border: 4px solid rgba(245, 158, 11, 0.3); }
        .slide-info { flex: 1; padding: 40px; text-align: right; }
        .slide-title { font-size: 80px; font-weight: 900; margin-bottom: 25px; line-height: 1.1; color: #f8fafc; }
        .slide-price { font-size: 60px; color: #4ade80; font-weight: 900; background: rgba(74, 222, 128, 0.12); display: inline-block; padding: 15px 50px; border-radius: 25px; border: 2px solid rgba(74, 222, 128, 0.4); }
        .old-price-tv { text-decoration: line-through; color: #94a3b8; font-size: 45px; margin-left: 20px; }
    </style>
</head>
<body>

    <div class="tv-header">
        <h1 id="cafeName">جاري التحميل...</h1>
        <div class="qr-wrapper">
            <div class="qr-section">
                <div class="qr-text">امسح الباركود<br><span style="color: var(--accent);">للطلب من طاولتك</span></div>
                <img id="qrCode" src="" alt="QR Code">
            </div>
        </div>
    </div>

    <div class="welcome-ticker-box">
        <div class="ticker-content" id="tickerText">
            <i class="fas fa-mug-hot"></i> جاري التحميل...
        </div>
    </div>

    <!-- بوكس الإعلان الخارجي المطور (كتابة فوق متحركة وصورة تحت بتحركات سينمائية) -->
    <div id="adminPromoBox" class="admin-promo-banner" style="display: none;">
        <div class="promo-card">
            <div class="promo-info">
                <div class="promo-badge"><i class="fas fa-star"></i> إعلان مميز وخارجي</div>
                <div class="promo-title" id="promoTitle">عنوان الإعلان</div>
                <div class="promo-desc" id="promoDesc">تفاصيل العرض هنا</div>
                <div class="promo-phone"><i class="fas fa-phone-alt"></i> <span id="promoPhone" dir="ltr">01000000000</span></div>
            </div>
            <div class="promo-img" id="promoImgBox"></div>
        </div>
    </div>

    <div class="slider-container" id="slider">
        <div style="text-align: center; color: #64748b; font-size: 30px;">
            <i class="fas fa-spinner fa-spin" style="font-size: 60px; color: var(--accent); margin-bottom: 20px;"></i>
            <p>جاري تحميل العروض والمنتجات...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://izfvaxfhdugqruxigbfa.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6ZnZheGZoZHVncXJ1eGlnYmZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MDQ2OTgsImV4cCI6MjEwNjk4MDY5OH0.DXBtBIjNQaY6JEnTz5BLV7uY-1Xvx-JH61WLMyMjbsk';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        let cafeToken = urlParams.get('cafe');
        const cafeIdParam = urlParams.get('id');

        if (!cafeToken && !cafeIdParam) {
            const fullQuery = window.location.search.replace('?', '');
            if (fullQuery.includes('cafe=')) {
                cafeToken = fullQuery.split('cafe=')[1].split('&')[0];
            }
        }

        let currentSlide = 0;
        let slides = [];

        async function fetchTvData() {
            try {
                let cafeQuery = db.from('cafes').select('id, name, is_active');
                if (cafeToken) cafeQuery = cafeQuery.eq('public_token', cafeToken);
                else if (cafeIdParam) cafeQuery = cafeQuery.eq('id', cafeIdParam);
                else {
                    const { data: defaultCafe } = await db.from('cafes').select('id, name, is_active').eq('is_active', true).order('id', { ascending: false }).limit(1).single();
                    if (defaultCafe) { loadTvContent(defaultCafe.id, defaultCafe.name); return; }
                    return;
                }

                const { data: cafeData } = await cafeQuery.single();
                if(!cafeData || !cafeData.is_active) return;
                
                loadTvContent(cafeData.id, cafeData.name);
            } catch (err) {}
        }

        async function loadTvContent(cafeId, cafeName) {
            document.getElementById('cafeName').innerText = cafeName;

            const currentLink = window.location.href.replace('tv.html', 'index.html');
            document.getElementById('qrCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentLink)}`;

            const { data: settings } = await db.from('settings').select('*').eq('cafe_id', cafeId).single();
            
            const promoBox = document.getElementById('adminPromoBox');
            if (settings && settings.is_ads_active) {
                promoBox.style.display = 'flex';
                document.getElementById('promoTitle').innerText = settings.ad_title || 'إعلان ترويجي';
                document.getElementById('promoDesc').innerText = settings.ad_desc || '';
                document.getElementById('promoPhone').innerText = settings.ad_phone || '';
                
                const imgBox = document.getElementById('promoImgBox');
                if (settings.ad_image) {
                    imgBox.innerHTML = `<img src="${settings.ad_image}" alt="Ad Image">`;
                } else {
                    imgBox.innerHTML = `<i class="fas fa-bullhorn" style="font-size: 100px; color: var(--accent);"></i>`;
                }
            } else {
                promoBox.style.display = 'none';
            }

            let announcement = (settings && settings.marquee_text) ? settings.marquee_text : `أهلاً بكم في ${cafeName} - استمتعوا بأجمل المشروبات والخدمات`;
            document.getElementById('tickerText').innerHTML = `
                <i class="fas fa-fire"></i> <span>${announcement}</span> 
                <i class="fas fa-coffee"></i> <span>امسح الباركود واطلب من طاولتك فوراً!</span> 
                <i class="fas fa-star"></i> <span>${announcement}</span>
            `;

            const { data: products } = await db.from('products').select('*').eq('cafe_id', cafeId).neq('image_url', '');
            const slider = document.getElementById('slider');
            
            if(!products || products.length === 0) {
                slider.innerHTML = '<div style="text-align: center; color: #64748b; font-size: 40px;"><i class="fas fa-images"></i><br>لا توجد منتجات مصورة لعرضها حالياً</div>';
                return;
            }

            slider.innerHTML = '';
            products.forEach((p, index) => {
                const slide = document.createElement('div');
                slide.className = `slide ${index === 0 ? 'active' : ''}`;
                
                let priceDisplay = `${p.price} ج.م`;
                if(p.original_price && p.original_price > p.price) {
                    priceDisplay = `<span class="old-price-tv">${p.original_price} ج.م</span> <span style="color:#4ade80;">${p.price} ج.م</span>`;
                }

                slide.innerHTML = `
                    <div class="slide-info">
                        <div class="slide-title">${p.name}</div>
                        <div class="slide-price">${priceDisplay}</div>
                    </div>
                    <div class="slide-img-box"><img src="${p.image_url}" alt="${p.name}"></div>
                `;
                slider.appendChild(slide);
            });

            slides = document.querySelectorAll('.slide');
            if(slides.length > 1) {
                setInterval(nextSlide, 6000);
            }
        }

        function nextSlide() {
            if(slides.length === 0) return;
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        fetchTvData();
        setInterval(fetchTvData, 10000);
    </script>
</body>
</html>
