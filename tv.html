<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة العرض</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #09090b; --accent: #f59e0b; --text: #fff; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* الهيدر */
        .tv-header { background: rgba(0,0,0,0.5); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(245, 158, 11, 0.3); }
        .tv-header h1 { margin: 0; font-size: 40px; font-weight: 900; color: var(--accent); text-shadow: 0 0 20px rgba(245, 158, 11, 0.5); }
        
        /* الباركود */
        .qr-section { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); }
        .qr-section img { width: 80px; height: 80px; border-radius: 10px; background: #fff; padding: 5px; }
        .qr-text { font-size: 18px; font-weight: bold; line-height: 1.4; }
        
        /* منطقة العرض (السلايد شو) */
        .slider-container { flex-grow: 1; position: relative; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1e293b 0%, #09090b 100%); }
        
        .slide { position: absolute; width: 80%; height: 80%; display: flex; align-items: center; opacity: 0; transition: opacity 1s ease-in-out, transform 1s ease-in-out; transform: scale(0.95); }
        .slide.active { opacity: 1; transform: scale(1); z-index: 10; }
        
        .slide-img-box { flex: 1; height: 100%; display: flex; justify-content: center; align-items: center; }
        .slide-img-box img { max-width: 100%; max-height: 100%; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 4px solid rgba(255,255,255,0.1); object-fit: cover; }
        
        .slide-info { flex: 1; padding: 50px; text-align: right; }
        .slide-title { font-size: 70px; font-weight: 900; margin-bottom: 20px; line-height: 1.2; text-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .slide-price { font-size: 50px; color: var(--accent); font-weight: bold; background: rgba(245, 158, 11, 0.1); display: inline-block; padding: 15px 40px; border-radius: 20px; border: 2px dashed var(--accent); }
        
        /* شريط الأخبار السفلي */
        .tv-footer { background: var(--accent); color: #000; padding: 15px 0; font-size: 30px; font-weight: 900; display: flex; align-items: center; }
        .ticker-title { background: #000; color: var(--accent); padding: 15px 30px; font-size: 25px; z-index: 2; margin-right: 20px; border-radius: 15px; }
        marquee { flex-grow: 1; margin-left: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div class="tv-header">
        <h1 id="cafeName">جاري التحميل...</h1>
        <div class="qr-section">
            <div class="qr-text">امسح الباركود<br><span style="color: var(--accent);">للطلب من طاولتك</span></div>
            <img id="qrCode" src="" alt="QR Code">
        </div>
    </div>

    <div class="slider-container" id="slider">
        <div style="text-align: center; color: #64748b; font-size: 30px;">
            <i class="fas fa-spinner fa-spin" style="font-size: 60px; color: var(--accent); margin-bottom: 20px;"></i>
            <p>جاري تحميل العروض...</p>
        </div>
    </div>

    <div class="tv-footer">
        <div class="ticker-title"><i class="fas fa-bolt"></i> عروض اليوم</div>
        <marquee id="marqueeText">أهلاً بكم.. نتمنى لكم وقتاً ممتعاً</marquee>
    </div>

    <script>
        const SUPABASE_URL = 'https://izfvaxfhdugqruxigbfa.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6ZnZheGZoZHVncXJ1eGlnYmZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MDQ2OTgsImV4cCI6MjEwNjk4MDY5OH0.DXBtBIjNQaY6JEnTz5BLV7uY-1Xvx-JH61WLMyMjbsk';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const cafeId = urlParams.get('id') || 1; 

        // توليد الباركود الخاص بمنيو الكافيه أوتوماتيكياً
        const baseUrl = window.location.origin;
        const menuLink = `${baseUrl}/?id=${cafeId}`;
        document.getElementById('qrCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(menuLink)}`;

        let currentSlide = 0;
        let slides = [];

        async function fetchTvData() {
            try {
                const { data: cafeData } = await db.from('cafes').select('name').eq('id', cafeId).single();
                if(cafeData) document.getElementById('cafeName').innerText = cafeData.name;

                const { data: settings } = await db.from('settings').select('marquee_text').eq('cafe_id', cafeId).single();
                if(settings) document.getElementById('marqueeText').innerText = settings.marquee_text;

                // هنجيب بس المنتجات اللي ليها صور عشان شكل الشاشة يبقى فخم
                const { data: products } = await db.from('products').select('*').eq('cafe_id', cafeId).neq('image_url', '');
                
                const slider = document.getElementById('slider');
                
                if(!products || products.length === 0) {
                    slider.innerHTML = '<div style="text-align: center; color: #64748b; font-size: 40px;"><i class="fas fa-images"></i><br>لم يتم إضافة صور للمنتجات حتى الآن</div>';
                    return;
                }

                slider.innerHTML = '';
                products.forEach((p, index) => {
                    const slide = document.createElement('div');
                    slide.className = `slide ${index === 0 ? 'active' : ''}`;
                    slide.innerHTML = `
                        <div class="slide-info">
                            <div class="slide-title">${p.name}</div>
                            <div class="slide-price">${p.price} ج.م</div>
                        </div>
                        <div class="slide-img-box">
                            <img src="${p.image_url}" alt="${p.name}">
                        </div>
                    `;
                    slider.appendChild(slide);
                });

                slides = document.querySelectorAll('.slide');
                if(slides.length > 1) {
                    setInterval(nextSlide, 5000); // تغيير الصورة كل 5 ثواني
                }

            } catch (err) {
                console.error("Error loading TV data");
            }
        }

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        fetchTvData();
        // تحديث الداتا كل 5 دقايق عشان لو صاحب الكافيه ضاف منتج جديد يظهر لوحده
        setInterval(fetchTvData, 300000); 
    </script>
</body>
</html>
