<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة العرض</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #09090b; --accent: #f59e0b; --text: #fff; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        .tv-header { background: rgba(0,0,0,0.6); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(245, 158, 11, 0.3); }
        .tv-header h1 { margin: 0; font-size: 45px; font-weight: 900; color: var(--accent); text-shadow: 0 2px 10px rgba(245,158,11,0.3); }
        
        .qr-wrapper { display: flex; flex-direction: column; align-items: flex-end; }
        .qr-section { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.08); padding: 10px 20px; border-radius: 15px; border: 1px solid rgba(245, 158, 11, 0.3); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .qr-section img { width: 75px; height: 75px; border-radius: 10px; background: #fff; padding: 4px; }
        .qr-text { font-size: 16px; font-weight: bold; line-height: 1.4; color: #f8fafc; }

        /* شريط الترحيب الجديد تحت الباركود وتحت الخط الفاصل */
        .welcome-ticker-box { width: 100%; background: linear-gradient(90deg, rgba(245,158,11,0.15), rgba(30,41,59,0.8), rgba(245,158,11,0.15)); border-bottom: 2px solid rgba(245, 158, 11, 0.4); padding: 12px 0; overflow: hidden; white-space: nowrap; box-shadow: inset 0 0 20px rgba(245,158,11,0.1); }
        .ticker-content { display: inline-block; animation: scrollTicker 25s linear infinite; font-size: 24px; font-weight: 900; color: #fde047; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
        .ticker-content i { color: var(--accent); margin-left: 10px; margin-right: 20px; }

        @keyframes scrollTicker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .slider-container { flex-grow: 1; position: relative; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1e293b 0%, #09090b 100%); }
        
        /* حركات بصرية مبهرة للسلايدر */
        .slide { position: absolute; width: 85%; height: 75%; display: flex; align-items: center; opacity: 0; transform: scale(0.9) translateY(20px); transition: all 1s cubic-bezier(0.4, 0, 0.2, 1); }
        .slide.active { opacity: 1; transform: scale(1) translateY(0); z-index: 10; }
        
        .slide-img-box { flex: 1; height: 100%; display: flex; justify-content: center; align-items: center; }
        .slide-img-box img { max-width: 90%; max-height: 90%; border-radius: 30px; box-shadow: 0 25px 60px rgba(0,0,0,0.9); object-fit: cover; border: 3px solid rgba(255,255,255,0.1); animation: floatImage 4s ease-in-out infinite; }
        
        @keyframes floatImage {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .slide-info { flex: 1; padding: 40px; text-align: right; }
        .slide-title { font-size: 75px; font-weight: 900; margin-bottom: 25px; line-height: 1.2; color: #f8fafc; text-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        .slide-price { font-size: 55px; color: #4ade80; font-weight: 900; background: rgba(74, 222, 128, 0.1); display: inline-block; padding: 15px 45px; border-radius: 20px; border: 1px solid rgba(74, 222, 128, 0.3); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .old-price-tv { text-decoration: line-through; color: #94a3b8; font-size: 40px; margin-left: 20px; }
    </style>
</head>
<body>

    <div class="tv-header">
        <h1 id="cafeName">جاري التحميل...</h1>
        <div class="qr-wrapper">
            <div class="qr-section">
                <div class="qr-text">امسح الباركود<br><span style="color: var(--accent);">للطلب من طاولتك</span></div>
                <img id="qrCode" src="" alt="QR Code">
            </div>
        </div>
    </div>

    <!-- شريط الترحيب تحت الباركود مباشرة -->
    <div class="welcome-ticker-box">
        <div class="ticker-content" id="tickerText">
            <i class="fas fa-star"></i> أهلاً بكم في الكافيه - استمتعوا بأجمل المشروبات والعروض المميزة <i class="fas fa-star"></i>
        </div>
    </div>

    <div class="slider-container" id="slider">
        <div style="text-align: center; color: #64748b; font-size: 30px;">
            <i class="fas fa-spinner fa-spin" style="font-size: 60px; color: var(--accent); margin-bottom: 20px;"></i>
            <p>جاري تحميل العروض والمنتجات...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://izfvaxfhdugqruxigbfa.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6ZnZheGZoZHVncXJ1eGlnYmZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MDQ2OTgsImV4cCI6MjEwNjk4MDY5OH0.DXBtBIjNQaY6JEnTz5BLV7uY-1Xvx-JH61WLMyMjbsk';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        let cafeToken = urlParams.get('cafe');
        const cafeIdParam = urlParams.get('id');

        if (!cafeToken && !cafeIdParam) {
            const fullQuery = window.location.search.replace('?', '');
            if (fullQuery.includes('cafe=')) {
                cafeToken = fullQuery.split('cafe=')[1].split('&')[0];
            }
        }

        let currentSlide = 0;
        let slides = [];

        async function fetchTvData() {
            try {
                let cafeQuery = db.from('cafes').select('id, name, is_active');
                if (cafeToken) cafeQuery = cafeQuery.eq('public_token', cafeToken);
                else if (cafeIdParam) cafeQuery = cafeQuery.eq('id', cafeIdParam);
                else {
                    const { data: defaultCafe } = await db.from('cafes').select('id, name, is_active').eq('is_active', true).order('id', { ascending: false }).limit(1).single();
                    if (defaultCafe) { loadTvContent(defaultCafe.id, defaultCafe.name); return; }
                    return;
                }

                const { data: cafeData } = await cafeQuery.single();
                if(!cafeData || !cafeData.is_active) return;
                
                loadTvContent(cafeData.id, cafeData.name);
            } catch (err) {}
        }

        async function loadTvContent(cafeId, cafeName) {
            document.getElementById('cafeName').innerText = cafeName;

            const currentLink = window.location.href.replace('tv.html', 'index.html');
            document.getElementById('qrCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentLink)}`;

            const { data: settings } = await db.from('settings').select('marquee_text').eq('cafe_id', cafeId).single();
            let announcement = (settings && settings.marquee_text) ? settings.marquee_text : `أهلاً بكم في ${cafeName} - نتمنى لكم وقتاً ممتعاً ومميزاً معنا`;
            
            document.getElementById('tickerText').innerHTML = `
                <i class="fas fa-fire" style="color:#f59e0b;"></i> ${announcement} 
                <i class="fas fa-mug-hot" style="color:#f59e0b;"></i> أطلب الآن من طاولتك بكل سهولة! 
                <i class="fas fa-star" style="color:#f59e0b;"></i> ${announcement}
            `;

            const { data: products } = await db.from('products').select('*').eq('cafe_id', cafeId).neq('image_url', '');
            const slider = document.getElementById('slider');
            
            if(!products || products.length === 0) {
                slider.innerHTML = '<div style="text-align: center; color: #64748b; font-size: 40px;"><i class="fas fa-images"></i><br>لا توجد منتجات مصورة لعرضها حالياً</div>';
                return;
            }

            slider.innerHTML = '';
            products.forEach((p, index) => {
                const slide = document.createElement('div');
                slide.className = `slide ${index === 0 ? 'active' : ''}`;
                
                let priceDisplay = `${p.price} ج.م`;
                if(p.original_price && p.original_price > p.price) {
                    priceDisplay = `<span class="old-price-tv">${p.original_price} ج.م</span> <span style="color:#f59e0b;">${p.price} ج.م</span>`;
                }

                slide.innerHTML = `
                    <div class="slide-info">
                        <div class="slide-title">${p.name}</div>
                        <div class="slide-price">${priceDisplay}</div>
                    </div>
                    <div class="slide-img-box"><img src="${p.image_url}" alt="${p.name}"></div>
                `;
                slider.appendChild(slide);
            });

            slides = document.querySelectorAll('.slide');
            if(slides.length > 1) {
                setInterval(nextSlide, 5000);
            }
        }

        function nextSlide() {
            if(slides.length === 0) return;
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        fetchTvData();
        setInterval(fetchTvData, 60000);
    </script>
</body>
</html>
